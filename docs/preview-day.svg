<svg xmlns="http://www.w3.org/2000/svg" width="520" height="156" viewBox="0 0 520 156" role="img" aria-label="Simple-Calendars Minimalist Daily Card Preview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e2024"/>
      <stop offset="100%" stop-color="#25282e"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="504" height="140" rx="24" fill="url(#bg)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- Week Pill -->
  <rect x="28" y="24" width="96" height="28" rx="8" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="1.5"/>
  <text x="76" y="43" text-anchor="middle" fill="#f1f3f4" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="500">Semana 47</text>

  <!-- Date Column -->
  <text x="28" y="86" fill="#f1f3f4" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="500">mié. 18</text>
  <text x="28" y="110" fill="#d2d5da" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" font-weight="400">nov</text>

  <!-- Event Icon + Title -->
  <rect x="116" y="71" width="16" height="12" rx="2" fill="#f1f3f4"/>
  <path d="M121 71 v-2.5 a1.5 1.5 0 0 1 1.5-1.5 h3 a1.5 1.5 0 0 1 1.5 1.5 v2.5" fill="none" stroke="#f1f3f4" stroke-width="1.5"/>
  <text x="140" y="83" fill="#f1f3f4" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="500">Fer trabajo</text>

  <!-- Time Range -->
  <text x="490" y="83" text-anchor="end" fill="#f1f3f4" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" font-weight="400">9:00 - 17:00</text>

  <!-- Remaining Time -->
  <text x="116" y="109" fill="#e8eaed" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="400">6 horas</text>

  <!-- Progress Bar -->
  <rect x="116" y="120" width="374" height="4" rx="2" fill="rgba(255,255,255,0.28)"/>
  <rect x="116" y="120" width="112" height="4" rx="2" fill="#ffffff"/>
</svg>
